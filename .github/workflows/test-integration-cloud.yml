name: Trusted branch - Cloud Integration Tests
# Never add pull_request, pull_request_target, workflow_run, or PR-ref inputs here.
on:
  push:
    branches: [master]
  workflow_dispatch:

# cancel old workflow if new one is triggered
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
jobs:
  integration:
    if: github.repository == 'streamnative/function-mesh' && github.ref == 'refs/heads/master' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 80
    strategy:
      matrix:
        case:
          - name: integration test with oauth2
            e2e: ".ci/tests/integration-oauth2/e2e.yaml"
          - name: integration test with downloader
            e2e: ".ci/tests/integration-oauth2/e2e_with_downloader.yaml"
    steps:
      - name: Free Disk Space (Ubuntu)
        uses: jlumbroso/free-disk-space@f68fdb76e2ea636224182cfb7377ff9a1708f9b8 # v1.3.0
        with:
          # this might remove tools that are actually needed,
          # if set to "true" but frees about 6 GB
          tool-cache: true
          # all of these default to true, but feel free to set to
          # "false" if necessary for your workflow
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true

      # the runner machine has a disk /dev/sdb1 which mounted to /mnt, and it has more free disk than /dev/sda1.
      # we can use it to save docker's data to avoid bookie error due to lack of disk.
      - name: change docker data dir
        run: |
          sudo service docker stop
          echo '{ "exec-opts": ["native.cgroupdriver=cgroupfs"], "cgroup-parent": "/actions_job", "data-root": "/mnt/docker" }' | sudo tee /etc/docker/daemon.json
          sudo service docker start

      - name: Report disk usage
        run: df -h

      - name: Set up GO 1.26.11
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          cache: false
          go-version: 1.26.11

      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0

      # Only this step gets cloud credentials. Checkout is the trusted event SHA.
      - uses: apache/skywalking-infra-e2e@82494d053f879c2e10bc6c1439c05673d50bb37b # v1.2.0
        env:
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          GSA_CREDENTIAL: ${{ matrix.case.name == 'integration test with oauth2' && secrets.GSA_CREDENTIAL || '' }}
        with:
          e2e-file: ${{matrix.case.e2e}}

      - name: Cleanup
        if: ${{ failure() }}
        run: e2e cleanup -c ${{matrix.case.e2e}}
