name: Precommit - Workflow security

on:
  pull_request:
    paths:
      - '.github/**'
      - '.ci/tests/integration*/**'
  push:
    branches: [master]
    paths:
      - '.github/**'
      - '.ci/tests/integration*/**'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install pinned workflow test dependency
        run: |
          python -m pip install --only-binary=:all: --require-hashes -r .github/scripts/workflow-security-requirements.txt
      - name: Validate GitHub Actions syntax and expressions
        run: |
          curl --fail --silent --show-error --location -o "$RUNNER_TEMP/actionlint.tar.gz" https://github.com/rhysd/actionlint/releases/download/v1.7.7/actionlint_1.7.7_linux_amd64.tar.gz
          echo "023070a287cd8cccd71515fedc843f1985bf96c436b7effaecce67290e7e0757  $RUNNER_TEMP/actionlint.tar.gz" | sha256sum --check --strict
          tar -xzf "$RUNNER_TEMP/actionlint.tar.gz" -C "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint" -shellcheck='' -pyflakes=''
      - name: Test workflow trust boundaries
        run: python .github/scripts/test_workflow_security.py
