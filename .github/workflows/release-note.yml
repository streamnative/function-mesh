name: Function-Mesh Release Notes

on:
  push:
    branches: [master]
    paths-ignore:
      - 'docs/**'
      - 'README.md'

permissions: {}

jobs:
  update_release_draft:
    if: github.repository == 'streamnative/function-mesh'
    permissions:
      contents: write
      pull-requests: read
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Update draft release notes
        uses: release-drafter/release-drafter@6a93d829887aa2e0748befe2e808c66c0ec6e4c7 # v6
        with:
          disable-autolabeler: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
