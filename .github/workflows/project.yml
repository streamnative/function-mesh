name: Precommit - Unit Tests
on:
  pull_request:
    branches:
      - "*"
    paths-ignore:
      - "docs/**"
      - "README.md"
      - "CHANGELOG.md"
      - "PROJECT"
      - "LICENSE"
      - "mesh-worker-service/README.md"
      - "tools/README.md"
permissions:
  contents: read

jobs:
  build:
    name: unit-tests
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        go-version: [1.26.10]
    steps:
      - name: Free Disk Space (Ubuntu)
        uses: jlumbroso/free-disk-space@f68fdb76e2ea636224182cfb7377ff9a1708f9b8 # v1.3.0
        with:
          # this might remove tools that are actually needed,
          # if set to "true" but frees about 6 GB
          tool-cache: false
          # all of these default to true, but feel free to set to
          # "false" if necessary for your workflow
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          cache: false
          go-version: ${{ matrix.go-version }}
        id: go

      - name: Check out code into the Go module directory
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: InstallKubebuilder
        run: |
          curl --fail --silent --show-error --location -o kubebuilder "https://github.com/kubernetes-sigs/kubebuilder/releases/download/v3.6.0/kubebuilder_linux_amd64"
          echo 'd5a9f639cb98298817bcab32b6046eb45cb912b56217a75d729646512a436ff4  kubebuilder' | sha256sum --check --strict
          chmod +x kubebuilder && mv kubebuilder /usr/local/bin/

      - name: InstallTool
        run: |
          GOBIN=$(pwd)/bin go install github.com/golangci/golangci-lint/cmd/golangci-lint@v1.64.7
          ./bin/golangci-lint --version

      - name: validate controller-gen
        run: |
          make manager

      - name: BuildProject
        run: |
          go mod download
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 GO111MODULE=on go build -a -o manager main.go

      - name: CheckStyle
        run: |
          ./bin/golangci-lint run -c ./.golangci.yml ./...

      - name: Check License Header
        run: |
          go test license_test.go

      - name: Get vertical-pod-autoscaler crd
        run: |
          wget https://raw.githubusercontent.com/kubernetes/autoscaler/0e493b62210509c14233575696100104ef1d9e76/vertical-pod-autoscaler/deploy/vpa-v1-crd-gen.yaml -O config/crd/bases/vpa-v1-crd.yaml

      - name: Run unit test check
        run: make test

      - name: Run envtest for controller
        run: make test-ginkgo
